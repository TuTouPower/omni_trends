services:
  omnitrends:
    build: .
    ports:
      - '4444:4444'
    volumes:
      - omnitrends_data:/usr/app/.data
    environment:
      - G_CLIENT_ID=
      - G_CLIENT_SECRET=
      - JWT_SECRET=
      - INIT_TABLE=true
      - ENABLE_CACHE=true

volumes:
  omnitrends_data:
    name: omnitrends_data
